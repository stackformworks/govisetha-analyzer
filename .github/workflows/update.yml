name: Collect and publish Govisetha

on:
  push:
    branches: [main]
    paths-ignore: ['site/data/govisetha.json']

  schedule:
    - cron: '17 18 * * *'
    - cron: '37 1 * * *'

  workflow_dispatch:
    inputs:
      batch:
        description: Maximum draw pages per run
        default: '30'
      earliest:
        description: Earliest draw number
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: govisetha-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch verified results
        if: github.event_name != 'push'
        id: collect
        continue-on-error: true
        env:
          BATCH: ${{ inputs.batch || '30' }}
          EARLIEST: ${{ inputs.earliest || '1' }}
        run: |
          python -m collector.main --batch "$BATCH" --earliest "$EARLIEST"

      - name: Persist last good data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/govisetha.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified NLB results'
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
